<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>OG</title>
<!-- Vorschaubild fuer geteilte Links (og:image), 1200 × 630: das Titelblatt der Startseite.
     Gerendert mit Chrome bei doppelter Dichte und auf 1200 × 630 verkleinert (assets/og.png). -->
<style>
@font-face { font-family:'Cormorant Garamond'; font-weight:400; src:url(fonts/CormorantGaramond-400-latin.woff2) format('woff2'); }
@font-face { font-family:'Cormorant Garamond'; font-style:italic; font-weight:400; src:url(fonts/CormorantGaramond-400-italic-latin.woff2) format('woff2'); }
@font-face { font-family:'Source Serif 4'; font-weight:200 900; src:url(fonts/SourceSerif4-Variable-roman.woff2) format('woff2'); }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1200px; height:630px; background:#1c1b20; font-family:'Source Serif 4',Georgia,serif; -webkit-font-smoothing:antialiased; }
.frame { position:absolute; inset:22px; border:1px solid #3a3840; display:flex; flex-direction:column; align-items:center; padding-top:30px;
  background:radial-gradient(ellipse 70% 60% at 50% 62%, #2a282e 0%, #1c1b20 72%); }
.vorname { font-size:15px; font-weight:500; letter-spacing:.42em; margin-right:-.42em; text-transform:uppercase; color:#b0a89b; }
.name { font-family:'Cormorant Garamond',Georgia,serif; font-weight:400; font-size:68px; line-height:1; color:#f0ede4; margin:8px 0 24px; }
.reihe { display:flex; gap:42px; }
.bild { width:200px; display:flex; flex-direction:column; align-items:center; }
.bogen { position:relative; width:200px; height:260px; border-radius:999px 999px 3px 3px; overflow:hidden; background:#121116; box-shadow:0 26px 40px -24px rgba(0,0,0,.9); }
.bogen img { width:100%; height:100%; object-fit:cover; display:block; }
.bogen::after { content:""; position:absolute; inset:6px; border:1px solid rgba(203,170,92,.62); border-radius:999px 999px 2px 2px; }
.kommt .bogen img { filter:grayscale(1) brightness(.6) contrast(.92); }
.kommt .bogen::after { border:1px dashed rgba(176,168,155,.4); }
.wer { margin-top:12px; font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:27px; line-height:1; color:#f0ede4; }
.kommt .wer { color:#9a9388; }
.fuss { position:absolute; left:0; right:0; bottom:26px; text-align:center; font-size:13px; font-weight:500; letter-spacing:.3em; margin-right:-.3em; text-transform:uppercase; color:#8f887d; font-variant-numeric:lining-nums; }
.fuss b { color:#cbaa5c; font-weight:500; }
</style>
</head>
<body>
<div class="frame">
  <div class="vorname">Edition</div>
  <div class="name">Deutscher Idealismus</div>
  <div class="reihe">
    <div class="bild kommt"><div class="bogen"><img src="bildnisse/fichte@2x.jpg"></div><div class="wer">Fichte</div></div>
    <div class="bild"><div class="bogen"><img src="bildnisse/schelling@2x.jpg"></div><div class="wer">Schelling</div></div>
    <div class="bild"><div class="bogen"><img src="bildnisse/hegel@2x.jpg"></div><div class="wer">Hegel</div></div>
  </div>
  <div class="fuss"><b>idealismedition.com</b> · Eine Recherche über 31 Bände</div>
</div>
</body>
</html>
