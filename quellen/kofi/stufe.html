<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Cormorant Garamond';font-weight:400;src:url(../../site/assets/fonts/CormorantGaramond-400-latin.woff2) format('woff2')}
@font-face{font-family:'Source Serif 4';font-weight:200 900;src:url(../../site/assets/fonts/SourceSerif4-Variable-roman.woff2) format('woff2')}
html,body{margin:0}
body{width:1200px;height:800px;background:#faf6ec;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Source Serif 4',serif;color:#24211c}
svg{width:300px;height:180px}
circle{fill:none;stroke:#d9d1c1;stroke-width:1.6}
circle.an{stroke:#7d6118;stroke-width:2.4}
h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:84px;line-height:1;margin:48px 0 0;letter-spacing:.01em}
p{margin:22px 0 0;font-size:21px;color:#6b6459;letter-spacing:.02em}
</style></head>
<body>
<svg viewBox="0 0 200 120">
  <circle id="a" cx="100" cy="44" r="34"/>
  <circle id="b" cx="80" cy="72" r="34"/>
  <circle id="c" cx="120" cy="72" r="34"/>
</svg>
<h1 id="name"></h1>
<p>German Idealism Edition</p>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('name').textContent=q.get('name');
(q.get('an')||'').split('').forEach(id=>document.getElementById(id).classList.add('an'));
</script>
</body></html>
